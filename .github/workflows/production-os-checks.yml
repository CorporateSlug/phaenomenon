name: Production OS checks
on:
  push:
    branches: [main]
    paths:
      - 'production-os.js'
      - 'production.html'
      - 'production.css'
      - 'tests/production-os.test.mjs'
      - 'tests/venue-workflow.test.mjs'
      - 'tests/venue-booking-ui.test.mjs'
      - 'tests/navigation.test.mjs'
      - 'tests/event-builder.test.mjs'
      - 'tests/flow-and-kit.test.mjs'
      - 'tests/published-gear-revisions.test.mjs'
      - 'tests/show-cue-editing.test.mjs'
      - 'tests/workspace-safety.test.mjs'
      - 'tests/backend-schema-static.test.mjs'
      - 'supabase/**'
      - 'event-builder.js'
      - 'workspace-safety.js'
      - 'index.html'
      - 'styles.css'
      - 'venue-workflow.js'
      - 'venue-workflow.css'
      - 'app.js'
      - 'space-planner.js'
      - 'multi-space.js'
      - '.github/workflows/production-os-checks.yml'
  pull_request:
    paths:
      - 'production-os.js'
      - 'production.html'
      - 'production.css'
      - 'tests/production-os.test.mjs'
      - 'tests/venue-workflow.test.mjs'
      - 'tests/venue-booking-ui.test.mjs'
      - 'tests/navigation.test.mjs'
      - 'tests/event-builder.test.mjs'
      - 'tests/flow-and-kit.test.mjs'
      - 'tests/published-gear-revisions.test.mjs'
      - 'tests/show-cue-editing.test.mjs'
      - 'tests/workspace-safety.test.mjs'
      - 'tests/backend-schema-static.test.mjs'
      - 'supabase/**'
      - 'event-builder.js'
      - 'workspace-safety.js'
      - 'index.html'
      - 'styles.css'
      - 'venue-workflow.js'
      - 'venue-workflow.css'
      - 'app.js'
      - 'space-planner.js'
      - 'multi-space.js'
      - '.github/workflows/production-os-checks.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check production-os.js && node --check app.js && node --check event-builder.js && node --check workspace-safety.js
      - name: Run Production OS and venue workflow regression suites
        run: node --test tests/*.test.mjs
