name: Production OS checks
on:
  push:
    branches: [main]
    paths:
      - 'production-os.js'
      - 'production.html'
      - 'production.css'
      - 'tests/production-os.test.mjs'
      - 'tests/venue-workflow.test.mjs'
      - 'tests/venue-booking-ui.test.mjs'
      - 'tests/navigation.test.mjs'
      - 'styles.css'
      - 'venue-workflow.js'
      - 'venue-workflow.css'
      - 'app.js'
      - 'space-planner.js'
      - 'multi-space.js'
      - '.github/workflows/production-os-checks.yml'
  pull_request:
    paths:
      - 'production-os.js'
      - 'production.html'
      - 'production.css'
      - 'tests/production-os.test.mjs'
      - 'tests/venue-workflow.test.mjs'
      - 'tests/venue-booking-ui.test.mjs'
      - 'tests/navigation.test.mjs'
      - 'styles.css'
      - 'venue-workflow.js'
      - 'venue-workflow.css'
      - 'app.js'
      - 'space-planner.js'
      - 'multi-space.js'
      - '.github/workflows/production-os-checks.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check production-os.js
      - name: Run Production OS and venue workflow regression suites
        run: node --test tests/production-os.test.mjs tests/venue-workflow.test.mjs tests/venue-booking-ui.test.mjs tests/navigation.test.mjs
